override_2p1d_pp8_dep16_c224:
  name: glm5.2-fp4-gb200-llmd-sglang-agentx-disagg-2p1d-pp8-dep16-c224
  frontend:
    epp_config:
      apiVersion: llm-d.ai/v1
      featureGates:
      - flowControl
      dataLayer:
        injectDefaults: false
      plugins:
      - type: agent-identity
        parameters:
          additionalSessionHeaders:
          - x-session-id
          - x-correlation-id
      - type: program-aware-fairness
        parameters:
          strategy: turn-priority
          turnPriorityTimeWeight: 12.0
          turnPriorityInactivitySeconds: 120
          evictionTtlSeconds: 75
          evictionSweepSeconds: 10
      - type: always-disagg-pd-decider
      - type: disagg-profile-handler
        parameters:
          deciders:
            prefill: always-disagg-pd-decider
      - type: prefill-filter
      - type: decode-filter
      - type: outlen-bucket
      - type: approx-prefix-cache-producer
        parameters:
          autoTune: false
          blockSizeTokens: 64
          maxPrefixTokensToMatch: 0
          maxPrefixBlocksToMatch: 0
          lruCapacityPerServer: 524288
      - type: inflight-load-producer
        parameters:
          prefixMatchInfoProducerName: approx-prefix-cache-producer
          addEstimatedOutputTokens: true
          maxEstimatedOutputTokens: 1024
      - name: decode-load-producer
        type: inflight-load-producer
        parameters:
          prefixMatchInfoProducerName: no-prefix-discount
          addEstimatedOutputTokens: true
          maxEstimatedOutputTokens: 1024
      - name: prefill-concurrency
        type: concurrency-detector
        parameters:
          concurrencyMode: requests
          maxConcurrency: 28
          headroom: 1.0
          inFlightLoadProducerName: inflight-load-producer
      - name: prefill-saturation
        type: max-saturation-detector
        parameters:
          detectors:
          - prefill-concurrency
          stages:
            prefill-concurrency:
            - prefill
      - type: prefix-cache-scorer
        parameters:
          prefixMatchInfoProducerName: approx-prefix-cache-producer
      - type: active-request-scorer
      - name: token-load-scorer
        type: token-load-scorer
        parameters:
          queueThresholdTokens: 393216
          inFlightLoadProducerName: inflight-load-producer
      - name: decode-kv-token-scorer
        type: token-load-scorer
        parameters:
          queueThresholdTokens: 2621440
          inFlightLoadProducerName: decode-load-producer
      - type: max-score-picker
      - name: session-affinity-prefill
        type: session-affinity-scorer
        parameters:
          strategy: session_id
          profileName: prefill
          sessionIdConfig:
            sources:
            - header: x-session-id
            - header: x-correlation-id
            evictionTtlSeconds: 3600
      flowControl:
        defaultRequestTTL: 0s
        noEndpointRequestTTL: 0s
        saturationDetector:
          pluginRef: prefill-saturation
        defaultPriorityBand:
          maxRequests: 10k
          maxBytes: 50Gi
          fairnessPolicyRef: program-aware-fairness
      schedulingProfiles:
      - name: prefill
        plugins:
        - pluginRef: prefill-filter
        - pluginRef: token-load-scorer
          weight: 24
        - pluginRef: active-request-scorer
          weight: 16
        - pluginRef: prefix-cache-scorer
          weight: 45
        - pluginRef: session-affinity-prefill
          weight: 65
        - pluginRef: max-score-picker
      - name: decode
        plugins:
        - pluginRef: decode-filter
        - pluginRef: active-request-scorer
          weight: 50
        - pluginRef: decode-kv-token-scorer
          weight: 120
        - pluginRef: max-score-picker
  roles:
    prefill:
      nodes: 4
      workers: 2
    decode:
      nodes: 4
      workers: 1
      gpus: 16
      args:
        tensor-parallel-size: 16
        data-parallel-size: 16
        expert-parallel-size: 16
        enable-dp-attention: true
        moe-a2a-backend: flashinfer
        moe-runner-backend: flashinfer_trtllm
        speculative-moe-a2a-backend: none
        speculative-moe-runner-backend: flashinfer_trtllm
